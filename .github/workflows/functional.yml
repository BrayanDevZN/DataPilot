name: Functional Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ENVIROIMENT: test
      DATABASE_URL: ""
      OPENAI_API_KEY: ""
      SING: ""
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build backend base image
        run: |
          docker build -f Dockerfile.base -t datapilot-base:latest .

      - name: Build API and worker images
        run: |
          docker compose build api worker

      - name: Checkout MCP Sender
        uses: actions/checkout@v4
        with:
          repository: BrayanDevZN/mcp_sender
          path: mcp_sender

      - name: Prepare sender environment file
        run: |
          cat <<'EOF' > mcp_sender/.env
          email=test@example.com
          password=test-password
          origin=*
          rate_limit=20
          global_rate_limit=200
          EOF

      - name: Build sender images locally
        run: |
          docker build -f mcp_sender/Dockerfile.base \
            -t brayandevzn/mcp_sender:base-v1 \
            mcp_sender

          docker build -f mcp_sender/Dockerfile.kafka \
            -t brayandevzn/mcp_sender:kafka-v1 \
            mcp_sender

          docker build -f mcp_sender/Dockerfile.consumer \
            -t brayandevzn/mcp_sender:consumer-v1 \
            mcp_sender

          docker build -f mcp_sender/Dockerfile.api \
            -t brayandevzn/mcp_sender:api-v1 \
            mcp_sender

          docker build -f mcp_sender/Dockerfile.worker \
            -t brayandevzn/mcp_server:worker-v1 \
            mcp_sender

      - name: Start sender stack
        run: |
          docker compose -f mcp_sender/sender-v1.yml up -d

      - name: Start backend stack
        env:
          DATAPILOT_API_PORT: "8001"
          URL_SENDER: http://host.docker.internal:8000
        run: |
          docker compose up -d redis redis-celery api worker

      - name: Set up Python for functional tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/functional/requirements.txt

      - name: Install functional test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/functional/requirements.txt

      - name: Run functional route tests
        env:
          FUNCTIONAL_BASE_URL: http://localhost:8001
          FUNCTIONAL_REDIS_HOST: localhost
          FUNCTIONAL_REDIS_PORT: "6379"
        run: |
          python tests/functional/routes.py

      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "=== DataPilot ==="
          docker compose ps
          docker compose logs --no-color api worker redis redis-celery
          echo "=== Sender ==="
          docker compose -f mcp_sender/sender-v1.yml ps
          docker compose -f mcp_sender/sender-v1.yml logs --no-color

      - name: Stop stack
        if: always()
        run: |
          docker compose down -v --remove-orphans
          docker compose -f mcp_sender/sender-v1.yml down -v --remove-orphans
