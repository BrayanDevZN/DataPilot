name: Functional Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ENVIROIMENT: test
      DATABASE_URL: ""
      OPENAI_API_KEY: ""
      SING: ""
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build backend base image
        run: |
          docker build -f Dockerfile.base -t datapilot-base:latest .

      - name: Build API and worker images
        run: |
          docker compose build api worker

      - name: Start backend stack
        run: |
          docker compose up -d redis redis-celery api worker

      - name: Set up Python for functional tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/functional/requirements.txt

      - name: Install functional test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/functional/requirements.txt

      - name: Run functional route tests
        env:
          FUNCTIONAL_BASE_URL: http://localhost:8000
          FUNCTIONAL_REDIS_HOST: localhost
          FUNCTIONAL_REDIS_PORT: "6379"
        run: |
          python tests/functional/routes.py

      - name: Show backend logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color api worker redis redis-celery

      - name: Stop stack
        if: always()
        run: |
          docker compose down -v --remove-orphans
