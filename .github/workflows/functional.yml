name: Functional Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ENVIROIMENT: test
      DATABASE_URL: ""
      OPENAI_API_KEY: ""
      SING: ""
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build backend images
        run: |
          docker compose --profile build --profile test build base api worker functional-tests

      - name: Start backend stack
        run: |
          docker compose up -d redis redis-celery api worker

      - name: Run functional route tests
        run: |
          docker compose --profile test run --rm functional-tests

      - name: Show backend logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color api worker redis redis-celery

      - name: Stop stack
        if: always()
        run: |
          docker compose down -v --remove-orphans
