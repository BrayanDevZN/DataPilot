x-backend-environment: &backend-environment
  ENVIROIMENT: ${ENVIROIMENT:-test}
  DATABASE_URL: ${DATABASE_URL:-}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}

  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0

  CELERY_BROKER_URL: redis://redis-celery:6379/0
  CELERY_BACKEND_URL: redis://redis-celery:6379/0

  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  SECRET: ${SECRET:-}
  SING: ${SING:-}

  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-30}
  URL_EMAIL: ${URL_EMAIL:-}
  URL_SENDER: ${URL_SENDER:-http://api:8000}

  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}

services:
  base:
    image: datapilot-base:latest
    build:
      context: .
      dockerfile: Dockerfile.base
    profiles:
      - build

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-celery:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: datapilot-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
      additional_contexts:
        base: service:base
    restart: unless-stopped
    environment:
      <<: *backend-environment
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/data
    depends_on:
      redis:
        condition: service_healthy
      redis-celery:
        condition: service_healthy

  worker:
    image: datapilot-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
      additional_contexts:
        base: service:base
    restart: unless-stopped
    environment:
      <<: *backend-environment
    volumes:
      - sqlite-data:/data
    depends_on:
      redis:
        condition: service_healthy
      redis-celery:
        condition: service_healthy


volumes:
  sqlite-data:
